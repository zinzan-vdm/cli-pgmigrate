services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pg
      POSTGRES_DB: pgmigrate_e2e
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pg -d pgmigrate_e2e"]
      interval: 2s
      timeout: 2s
      retries: 10
