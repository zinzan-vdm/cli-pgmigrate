name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - name: Type check
        run: bun x tsc --noEmit
      - name: Lint
        run: bun x eslint .
      - name: Tests
        run: bun test

  build:
    needs: quality
    strategy:
      matrix:
        target:
          - bun-linux-x64-baseline
          - bun-darwin-x64-baseline
          - bun-windows-x64-baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - name: Build for ${{ matrix.target }}
        run: |
          case "${{ matrix.target }}" in
            bun-linux-x64-baseline)   OUT="pgmigrate-linux-x64" ;;
            bun-darwin-x64-baseline)  OUT="pgmigrate-darwin-x64" ;;
            bun-windows-x64-baseline) OUT="pgmigrate-windows-x64.exe" ;;
          esac
          bun build --compile --target="${{ matrix.target }}" ./index.ts --outfile "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: pgmigrate-${{ matrix.target }}
          path: pgmigrate-*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pgmigrate-*
          merge-multiple: true
      - name: List binaries
        run: ls -lh pgmigrate-*
      - uses: softprops/action-gh-release@v2
        with:
          files: pgmigrate-*
          generate_release_notes: true
